[package]
name = "nanocodex-memory"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish = false
description = "The agent's memory of a person: markdown records the agent reads, a background reconciliation that writes them, and the store that keeps them"

[dependencies]
rustls.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
reqwest = { workspace = true, features = ["query", "json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
