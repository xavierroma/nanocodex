apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nanocodex
resources:
  - ../base
  - model.yaml
configMapGenerator:
  - name: mock-model
    files:
      - model.ts
patches:
  - target:
      kind: StatefulSet
      name: nanocodex-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OPENAI_BASE_URL
          value: http://mock-model:8081/v1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NANOCODEX_MCP_ALLOWED_URLS
          value: http://mock-model:8081/mcp
