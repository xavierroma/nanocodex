apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nanocodex-api
spec:
  serviceName: nanocodex-api
  replicas: 1
  selector:
    matchLabels:
      app: nanocodex-api
  template:
    metadata:
      labels:
        app: nanocodex-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: nanocodex-api:k8s-v4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NANOCODEX_DB
              value: /data/nanocodex.sqlite
            - name: NANOCODEX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nanocodex-api
                  key: api-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nanocodex-api
                  key: openai-api-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
